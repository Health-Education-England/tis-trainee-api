openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: "http://localhost:8203/trainee"
    description: Generated server url
paths:
  "/api/cct/calculation/{id}":
    get:
      tags:
        - cct-resource
      operationId: getCalculationDetails_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CctCalculationDetailDto"
    put:
      tags:
        - cct-resource
      operationId: updateCalculationDetails
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CctCalculationDetailDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CctCalculationDetailDto"
    delete:
      tags:
        - cct-resource
      operationId: deleteCalculation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: boolean
  /api/basic-details/gmc-number:
    put:
      tags:
        - basic-details-resource
      operationId: updateGmcNumber
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmcDetailsDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PersonalDetailsDto"
  /api/basic-details/email-address:
    put:
      tags:
        - basic-details-resource
      operationId: updateEmailAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailUpdateDto"
        required: true
      responses:
        "200":
          description: OK
  "/api/programme-membership/{programmeMembershipId}/sign-coj":
    post:
      tags:
        - programme-membership-resource
      operationId: signCoj
      parameters:
        - name: programmeMembershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ProgrammeMembershipDto"
  /api/cct/calculation:
    get:
      tags:
        - cct-resource
      operationId: getCalculationDetails
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CctCalculationDetailDto"
    post:
      tags:
        - cct-resource
      operationId: createCalculation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CctCalculationDetailDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CctCalculationDetailDto"
  /api/trainee-profile:
    get:
      tags:
        - trainee-profile-resource
      operationId: getTraineeProfile
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TraineeProfileDto"
  "/api/programme-membership/{programmeMembershipId}/confirmation":
    get:
      tags:
        - programme-membership-resource
      operationId: downloadPdf
      parameters:
        - name: programmeMembershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
components:
  schemas:
    CctCalculationDetailDto:
      required:
        - changes
        - name
        - programmeMembership
        - projection
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        traineeTisId:
          description: The TIS ID of the trainee who owns the calculation, assigned by the server.
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
        programmeMembership:
          $ref: "#/components/schemas/CctProgrammeMembershipDto"
        programmeDetails:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CctProgrammeDetailsDto"
        changes:
          description: |
            The changes affecting the trainee's programme.

            Rules:
            - No two changes may overlap. Each change covers `startDate` to `endDate` inclusive, so a change may not start on or before the `endDate` of an earlier change.
            - Every change's `startDate` must be on or after `programmeDetails.startDate`.
          type: array
          items:
            $ref: "#/components/schemas/CctChangeDto"
        projection:
          $ref: "#/components/schemas/ProjectionDto"
        result:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CctResultDto"
        cctDate:
          type: string
          format: date
          nullable: true
        created:
          type: string
          format: date-time
          nullable: true
        lastModified:
          type: string
          format: date-time
          nullable: true
    CctChangeDto:
      required:
        - id
        - startDate
        - endDate
        - type
      type: object
      properties:
        id:
          description: Unique identifier for the change, generated by the client and sent back unchanged on create and update.
          type: string
          format: uuid
          example: b2f8df7b-82f6-413f-8265-35a008d6b53b
        type:
          description: The type of change to the trainee's programme.
          type: string
          enum:
            - LTFT
            - OOPC
            - OOPE
            - OOPP
            - OOPR
            - OOPT
            - PARENTAL
            - PHASED
            - SHIELDING
            - SICKNESS
            - ACCRUED_LEAVE
        startDate:
          description: Date the change starts affecting the trainee's programme. It must be on or after programmeDetails.startDate.
          type: string
          format: date
        endDate:
          description: |
            Date the change stops affecting the trainee's programme. Must be on or after startDate.
            ie. Single-day changes are valid e.g. one sickness day.
          type: string
          format: date
        countsTowardsCompletion:
          description: |
            Indicates whether time between these dates counts as training towards programme completion.

            Rules by `type`:
            - `OOPR` or `OOPT`: required, may be `true` or `false`.
            - `LTFT`: optional, treated as `true` when null. If provided, must be `true` (`false` is invalid).
            - All other types: optional, treated as `false` when null. If provided, must be `false` (`true` is invalid).
          type: boolean
          nullable: true
        wte:
          description: |
            Whole-time equivalent during this change, expressed as a value between 0.01 and 1 (for example, 0.8 = 80%).
            Rules by `type` and `countsTowardsCompletion`:
            - `LTFT`: required, between 0.01 and 0.99.
            - `OOPR` with `countsTowardsCompletion` set to `true`: required, between 0.01 and 1.
            - All other cases, including `OOPT` and `OOPR` not counting towards completion: must be null.
          type: number
          format: double
          nullable: true
          minimum: 0.01
          maximum: 1
        notes:
          description: Free-text notes providing additional context for this change.
          type: string
          nullable: true
    ProjectionDto:
      required:
        - startDate
        - wte
      type: object
      properties:
        startDate:
          description: |
            Date from which the remaining training is projected.
            Must be strictly after the endDate of every entry in changes and on or after programmeDetails.startDate 
            (only applies when changes is empty).
          type: string
          format: date
        wte:
          description: |
            Whole-time equivalent used for the projection, expressed as a value between 0.01 and 1 (for example, 0.8 = 80%).
            A full-time projection is 1, a less than full-time (LTFT) projection is between 0.01 and 0.99.
          type: number
          format: double
          minimum: 0.01
          maximum: 1
    CctProgrammeDetailsDto:
      required:
        - specialty
        - startDate
        - lengthMonths
        - startGrade
        - additionalMonths
        - acceleratedMonths
      type: object
      properties:
        specialty:
          description: The specialty, from the known specialties list.
          type: string
        startDate:
          description: The programme start date.
          type: string
          format: date
        lengthMonths:
          description: The programme length in months, defaulted from the specialty.
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        startGrade:
          description: The starting grade, defaulted from the specialty but may be overridden.
          type: string
        startGradeOverrideNotes:
          description: Notes explaining the start grade override, required when the start grade is overridden.
          type: string
          nullable: true
        additionalMonths:
          description: Additional months of training, e.g. extra time after an ARCP outcome.
          type: integer
          format: int32
          minimum: 0
          maximum: 24
        additionalMonthsNotes:
          description: Notes explaining the additional months, required when additionalMonths is greater than 0.
          type: string
          nullable: true
        acceleratedMonths:
          description: Months of accelerated training, e.g. recognised prior learning.
          type: integer
          format: int32
          minimum: 0
          maximum: 12
        acceleratedMonthsNotes:
          description: Notes explaining the accelerated months, required when acceleratedMonths is greater than 0.
          type: string
          nullable: true
        eighteenMonthFinalGrade:
          description: A final grade year lasting 18 months rather than 12.
          type: string
          nullable: true
        eighteenMonthFinalGradeNotes:
          description: Notes explaining the 18 month final grade, required when eighteenMonthFinalGrade is set.
          type: string
          nullable: true
        skippedGrade:
          description: A grade year skipped in the progression.
          type: string
          nullable: true
        skippedGradeNotes:
          description: Notes explaining the skipped grade, required when skippedGrade is set.
          type: string
          nullable: true
    CctResultDto:
      required:
        - cctDate
      type: object
      properties:
        cctDate:
          description: The computed indicative CCT date.
          type: string
          format: date
        projection:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectionDto"
        totalWteMonthsCompleted:
          description: The total whole-time equivalent months of training completed.
          type: number
          format: double
          nullable: true
        monthsRemaining:
          description: The months of training remaining, may be negative if training is already complete.
          type: number
          format: double
          nullable: true
    CctProgrammeMembershipDto:
      required:
        - endDate
        - id
        - name
        - startDate
        - wte
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        wte:
          type: number
          format: double
        designatedBodyCode:
          type: string
          nullable: true
        managingDeanery:
          type: string
          nullable: true
    GmcDetailsDto:
      required:
        - gmcNumber
      type: object
      properties:
        gmcNumber:
          pattern: '\d{7}'
          type: string
        gmcStatus:
          type: string
    PersonalDetailsDto:
      type: object
      properties:
        surname:
          type: string
        forenames:
          type: string
        knownAs:
          type: string
        maidenName:
          type: string
        title:
          type: string
        role:
          type: array
          items:
            type: string
        personOwner:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        qualification:
          type: string
        dateAttained:
          type: string
          format: date
        medicalSchool:
          type: string
        telephoneNumber:
          type: string
        mobileNumber:
          type: string
        email:
          type: string
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        address4:
          type: string
        postCode:
          type: string
        gmcNumber:
          type: string
        gmcStatus:
          type: string
        gdcNumber:
          type: string
        gdcStatus:
          type: string
        publicHealthNumber:
          type: string
        eeaResident:
          type: string
        permitToWork:
          type: string
        settled:
          type: string
        visaIssued:
          type: string
          format: date
        detailsNumber:
          type: string
        prevRevalBody:
          type: string
        currRevalDate:
          type: string
          format: date
        prevRevalDate:
          type: string
          format: date
        signature:
          $ref: "#/components/schemas/Signature"
    Signature:
      type: object
      properties:
        signedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        hmac:
          type: string
    EmailUpdateDto:
      required:
        - email
      type: object
      properties:
        email:
          type: string
    ConditionsOfJoiningDto:
      type: object
      properties:
        signedAt:
          type: string
          format: date-time
        version:
          type: string
          enum:
            - GG9
            - GG10
        syncedAt:
          type: string
          format: date-time
    CurriculumDto:
      type: object
      properties:
        curriculumTisId:
          type: string
        curriculumName:
          type: string
        curriculumSubType:
          type: string
        curriculumSpecialty:
          type: string
        curriculumSpecialtyCode:
          type: string
        curriculumStartDate:
          type: string
          format: date
        curriculumEndDate:
          type: string
          format: date
        curriculumEligibleForPeriodOfGrace:
          type: boolean
        curriculumMembershipId:
          type: string
    HeeUserDto:
      type: object
      properties:
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        gmcId:
          type: string
        phoneNumber:
          type: string
    ProgrammeMembershipDto:
      required:
        - tisId
      type: object
      properties:
        tisId:
          type: string
        trainingNumber:
          type: string
        programmeTisId:
          type: string
        programmeName:
          type: string
        programmeNumber:
          type: string
        managingDeanery:
          type: string
        designatedBody:
          type: string
        designatedBodyCode:
          type: string
        programmeMembershipType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        programmeCompletionDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - PAST
            - CURRENT
            - FUTURE
        curricula:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumDto"
        trainingPathway:
          type: string
        conditionsOfJoining:
          $ref: "#/components/schemas/ConditionsOfJoiningDto"
        responsibleOfficer:
          $ref: "#/components/schemas/HeeUserDto"
        signature:
          $ref: "#/components/schemas/Signature"
    PlacementDto:
      required:
        - tisId
      type: object
      properties:
        tisId:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        otherSites:
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/SiteDto"
        grade:
          type: string
        specialty:
          type: string
        subSpecialty:
          type: string
        postAllowsSubspecialty:
          type: boolean
        otherSpecialties:
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyDto"
        placementType:
          type: string
        employingBody:
          type: string
        trainingBody:
          type: string
        wholeTimeEquivalent:
          type: string
        status:
          type: string
          enum:
            - PAST
            - CURRENT
            - FUTURE
        signature:
          $ref: "#/components/schemas/Signature"
    QualificationDto:
      required:
        - tisId
      type: object
      properties:
        tisId:
          type: string
        qualification:
          type: string
        dateAttained:
          type: string
          format: date
        medicalSchool:
          type: string
    SiteDto:
      type: object
      properties:
        site:
          type: string
        siteKnownAs:
          type: string
        siteLocation:
          type: string
    SpecialtyDto:
      type: object
      properties:
        specialtyId:
          type: string
        name:
          type: string
    TraineeProfileDto:
      required:
        - traineeTisId
      type: object
      properties:
        id:
          type: string
        traineeTisId:
          type: string
        personalDetails:
          $ref: "#/components/schemas/PersonalDetailsDto"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/QualificationDto"
        programmeMemberships:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammeMembershipDto"
        placements:
          type: array
          items:
            $ref: "#/components/schemas/PlacementDto"
